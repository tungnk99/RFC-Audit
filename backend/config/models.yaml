# Cấu hình mô hình (LLM gateway). Hash tệp này ghi vào bản kê lần chạy.
# Khoá API chỉ đọc từ biến môi trường, chỉ trong LLM gateway; ở đây chỉ ghi TÊN biến, không ghi khoá.
#
# Hai phần tách bạch:
#   models  kho mô hình được hỗ trợ, mỗi mô hình khai báo MỘT lần (nhà cung cấp, id, endpoint, biến chứa khoá, tham số).
#   agents  agent nào dùng mô hình nào (theo tên trong `models`). Đổi mô hình của một agent là đổi một dòng.
#
# Mô hình cục bộ (vLLM, Ollama...) không cần khoá: bỏ dòng api_key_env, ví dụ
#   qwen-local: {provider: openai_compatible, model: qwen2.5-coder, base_url: "http://localhost:8000/v1"}
# rồi gán cho agent cần giữ mã trong máy ở mục `agents` bên dưới. (BL-63: chưa thử với mô hình cục bộ thật.)
#
# Lưu ý: Claude đời mới trả 400 nếu đặt temperature/top_p; chỉ thêm `settings` khi mô hình hỗ trợ.
models:
  deepseek-flash:
    provider: openai_compatible
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # Tắt chế độ suy nghĩ của DeepSeek qua tham số riêng của họ: chế độ đó từ chối `tool_choice` mà runtime dùng để ép
    # đầu ra có cấu trúc (400 "Thinking mode does not support this tool_choice"), và khi thinking bật thì temperature
    # bị bỏ qua. (`thinking: false` chung của pydantic-ai không được dịch sang tham số này cho endpoint kiểu OpenAI.)
    settings: {temperature: 0, extra_body: {thinking: {type: disabled}}}

  # DeepSeek-V4-Flash qua FPT AI Marketplace (endpoint kiểu OpenAI). Cùng họ mô hình với deepseek-flash nên giữ cùng
  # `settings`; chưa kiểm tra FPT có nhận `extra_body.thinking` hay không (BL-63 tương tự: chưa thử thật).
  fpt-deepseek-flash:
    provider: openai_compatible
    model: DeepSeek-V4-Flash
    base_url: https://mkp-api.fptcloud.com/v1
    api_key_env: FPT_API_KEY
    output_mode: tool
    static_skills: true
    settings: {temperature: 0, extra_body: {thinking: {type: disabled}}}

  # Họ mô hình thứ hai (Zhipu GLM) cho phản biện độc lập (`verifier`, `rfc_analyst.b`) nhằm đóng CT-07.
  # Hỗ trợ cả BigModel API (https://open.bigmodel.cn/api/paas/v4) hoặc bất kỳ endpoint OpenAI-compatible nào.
  # Nếu endpoint GLM không hỗ trợ `tool_choice` khi bật/tắt thinking, đổi `output_mode: native` hoặc `prompted`.
  glm-flash:
    provider: openai_compatible
    model: glm-4.5-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: GLM_API_KEY
    output_mode: tool
    static_skills: true
    settings: {temperature: 0, extra_body: {thinking: {type: disabled}}}

# Hiện mọi agent mặc định dùng fpt-deepseek-flash (chỉ cần FPT_API_KEY).
# Để bật đa họ độc lập (đóng CT-07), đặt GLM_API_KEY và đổi `verifier` + `rfc_analyst.b` sang `glm-flash`.
agents:
  rfc_analyst.a: fpt-deepseek-flash
  rfc_analyst.b: fpt-deepseek-flash
  planner: fpt-deepseek-flash
  tester: fpt-deepseek-flash
  verifier: fpt-deepseek-flash
  report: fpt-deepseek-flash
  code_indexer: fpt-deepseek-flash
  code_reader: fpt-deepseek-flash

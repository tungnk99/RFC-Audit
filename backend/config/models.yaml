# Cấu hình mô hình (LLM gateway). Hash tệp này ghi vào bản kê lần chạy.
# Khoá API chỉ đọc từ biến môi trường, chỉ trong LLM gateway; ở đây chỉ ghi TÊN biến, không ghi khoá.
#
# Hai phần tách bạch:
#   models  kho mô hình được hỗ trợ, mỗi mô hình khai báo MỘT lần (nhà cung cấp, id, endpoint, biến chứa khoá, tham số).
#   agents  agent nào dùng mô hình nào (theo tên trong `models`). Đổi mô hình của một agent là đổi một dòng.
#
# Mô hình cục bộ (vLLM, Ollama...) không cần khoá: bỏ dòng api_key_env, ví dụ
#   qwen-local: {provider: openai_compatible, model: qwen2.5-coder, base_url: "http://localhost:8000/v1"}
# rồi gán cho agent cần giữ mã trong máy ở mục `agents` bên dưới. (BL-63: chưa thử với mô hình cục bộ thật.)
#
# Lưu ý: Claude đời mới trả 400 nếu đặt temperature/top_p; chỉ thêm `settings` khi mô hình hỗ trợ.
models:
  deepseek-flash:
    provider: openai_compatible
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    # Tắt chế độ suy nghĩ của DeepSeek qua tham số riêng của họ: chế độ đó từ chối `tool_choice` mà runtime dùng để ép
    # đầu ra có cấu trúc (400 "Thinking mode does not support this tool_choice"), và khi thinking bật thì temperature
    # bị bỏ qua. (`thinking: false` chung của pydantic-ai không được dịch sang tham số này cho endpoint kiểu OpenAI.)
    settings: {temperature: 0, extra_body: {thinking: {type: disabled}}}

# Hiện chỉ có một mô hình nên mọi agent dùng chung. Khi có thêm mô hình thì khai báo ở `models` rồi đổi dòng tương ứng.
# Hai chỗ thiết kế muốn KHÁC họ mô hình để lỗi ít tương quan: rfc_analyst.b (luồng dịch thứ hai, M2) và verifier
# (phản biện độc lập). Dùng chung một mô hình thì độc lập đó chưa có; ghi lại khi đánh giá.
agents:
  rfc_analyst.a: deepseek-flash
  rfc_analyst.b: deepseek-flash
  planner: deepseek-flash
  tester: deepseek-flash
  verifier: deepseek-flash
  report: deepseek-flash
  code_indexer: deepseek-flash
  code_reader: deepseek-flash

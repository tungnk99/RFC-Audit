summary: >
  Thiết kế kiến trúc (Antigravity) và giao `claude.cmd` triển khai `EpisodicMemory` (`rfcv/core/episodic_memory.py`,
  trung lập miền, lưu duy nhất các landmark `(file, symbol, line_start, line_end, rtype, finding)` đã qua `SchemaGate`,
  sanitization định danh đơn an toàn `TrustLabel.DERIVED`, hỗ trợ lưu/nạp JSON qua `RFCV_EPISODIC_MEMORY_PATH`).
  Xác thực sống trên Docker chuỗi 2 ca OpenSSL liên tiếp `OU2 -> OU3`:
  `OU2` ghi tự động `ssl/record/rec_layer_s3.c::ssl3_read_bytes (846-857, hits=1)`;
  `OU3` nạp sẵn `memory.codebase_map` đạt **`defect_hit_strict = True`** chỉ với **11 tool calls** và **31 giây**
  (giảm ~40–60% thời gian và tool calls so với chạy không có bộ nhớ), cập nhật `hits=2`, cả 2/2 ca đều `leak_scan.clean = True (0 leaks)`.
motivation: >
  Trải rộng đột biến sang trục bộ nhớ dài hạn liên ca (Cross-Case Episodic Memory) để Agent không phải dò lại
  từ đầu các hàm lõi khi kiểm toán nhiều yêu cầu trên cùng một kho mã nguồn.

summary: >
  Cài đặt mô hình tổ chức Phản biện ngang hàng (`_run_peer_review` trung lập miền trong `execution_loop.py`,
  `peer_review_config` trong `agents/code_reader/handler.py`, kích hoạt qua `RFCV_ORG_MODE=peer_review`, giữ nguyên
  mặc định Parallel Tournament). Đánh giá trực tiếp trên Docker trên đúng 6 ca OpenSSL khó (`OU2, OU3, OG1, OG2, OG4, OR1`):
  Verdict `6/6 (100%)`, Defect Hit STRICT `4/6 (66.7%, +50.0 pp so với Single Agent 1/6 = 16.7%)`,
  nhưng thấp hơn Parallel Tournament (`6/6 = 100.0%`) do hiệu ứng thiên lệch neo (anchoring bias trên `OU3`)
  khi Reviewer xem trước bản nháp của Investigator — khẳng định bằng chứng thực nghiệm vì sao Giải đấu độc lập song song
  vượt trội Phản biện tuần tự trong định vị nguyên nhân gốc bằng LLM.

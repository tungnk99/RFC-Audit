adapter: quic
version: 0.1.0
backend: aioquic
domain: rfc_protocol
verdict_profile: rfc-protocol@8
specs:
- doc: RFC9000
  role: primary
  sections_in_scope:
  - '4.6'
  - '8.1'
  - '10.2'
  - '11'
  - '12.4'
  - '14.1'
  - '19'
- doc: RFC9001
  role: reference
component_taxonomy:
- packetization
- frames
- connection_ids
- flow_control
- crypto_handshake
- connection_close
vocabulary:
  events:
  - receive(packet)
  - receive(frame)
  - send_connection_close(error_code)
  - send(packet_type)
  - close
  - discard
  states:
  - initial
  - connected
  enums:
    error_code:
    - no_error
    - internal_error
    - connection_refused
    - flow_control_error
    - stream_limit_error
    - stream_state_error
    - final_size_error
    - frame_encoding_error
    - transport_parameter_error
    - connection_id_limit_error
    - protocol_violation
    - invalid_token
    - application_error
    - crypto_buffer_exceeded
    - key_update_error
    - aead_limit_reached
    - no_viable_path
    packet_type:
    - initial
    - zero_rtt
    - handshake
    - retry
    - version_negotiation
    - one_rtt
field_domains:
  datagram.payload_length:
    min: 64
    max: 65507
    canonical:
    - 1199
  new_connection_id.length:
    min: 0
    max: 255
    canonical:
    - 21
consistency_rules: []
locator_hints:
  packetization:
    keywords:
    - NGTCP2_MAX_UDP_PAYLOAD_SIZE
    - dgramlen
    - initial
    entry_points:
    - ngtcp2_accept
    - ngtcp2_conn_read_pkt
    paths:
    - lib/ngtcp2_conn.c
    - lib/ngtcp2_pkt.c
  connection_ids:
    keywords:
    - new_connection_id
    - NGTCP2_MAX_CIDLEN
    - NGTCP2_FRAME_ENCODING_ERROR
    entry_points:
    - ngtcp2_conn_read_pkt
    paths:
    - lib/ngtcp2_pkt.c
    - lib/ngtcp2_conn.c
build_flags:
- --with-gnutls
sut:
  repo: https://github.com/ngtcp2/ngtcp2
  commit: 14c080969bbaf2bf6632d39f2f6c960efcada652
  recipe: sut/ngtcp2.yaml
  start:
    role: server
    port: 4433
references:
- ngtcp2-ref
code_scope:
  include:
  - lib/**
  - crypto/**
  exclude:
  - tests/**
  - examples/**
  - fuzz/**
  - doc/**
examples: examples/*.yaml
build_config_complete: true

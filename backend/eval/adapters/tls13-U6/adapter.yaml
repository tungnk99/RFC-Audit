# Adapter TLS 1.3 (thiết kế chính, mục 4.3; tài liệu adapter, mục 3).
# Dữ liệu khai báo, không mã tuỳ ý. Phải qua `rfcv adapter check adapters/tls13` trước khi dùng.
adapter: tls13
version: 0.1.0
backend: tlsfuzzer

domain: rfc_protocol
verdict_profile: rfc-protocol@8
specs:
  - {doc: RFC8446, role: primary, sections_in_scope: ["4.1", "4.2", "5.1", "5.2", "6"]}
  - {doc: RFC9846, role: reference, sections_in_scope: ["4.1", "4.2", "5.1", "5.2", "6"]}

component_taxonomy: [record_layer, handshake, key_schedule, extensions, alerts]

vocabulary:
  events:
    - receive(record)
    - receive(handshake_msg)
    - receive(client_hello)
    - send_alert(code)
    - send(content_type)
    - close
    - discard
  states: [initial, client_hello_sent, server_hello_sent, connected]
  alerts:
    - close_notify
    - unexpected_message
    - bad_record_mac
    - record_overflow
    - handshake_failure
    - bad_certificate
    - illegal_parameter
    - decode_error
    - decrypt_error
    - protocol_version
    - internal_error
    - missing_extension
    - unsupported_extension
    - insufficient_security
  content_types: [change_cipher_spec, alert, handshake, application_data]

field_domains:
  record.length: {min: 17, max: 65535, canonical: [16641, 65535]}           # uint16 (TLSCiphertext.length, TLSPlaintext.length)
  handshake.length: {min: 0, max: 16777215}     # uint24
  # Trường phân loại: loại bản ghi không được định nghĩa (byte 0, 99, 255), gửi rõ ngay sau khi nối (RFC 8446 §5)
  record.content_type: {values: [type_0, type_99, type_255]}
  # ClientHello có biến đổi (RFC 8446 §4.2.8, §4.2.7): key_share và nhóm hỗ trợ
  client_hello.key_share: {values: [valid, empty_entry, empty_extension]}
  client_hello.groups: {values: [overlap, disjoint]}

consistency_rules:
  - {if_expect_contains: send_alert, then_type: B}

# Gợi ý cho Locator (score = 3·kw + 2·comp + 2·near + 1·hint): keywords → kw, comp; entry_points → near (khoảng cách
# trên đồ thị gọi hàm); paths → hint. Tên hàm, tệp của wolfSSL; kiểm lại khi đổi commit SUT.
locator_hints:
  record_layer:
    keywords: ["record", "TLSCiphertext", "length", "MAX_RECORD_SIZE"]
    entry_points: ["ProcessReply", "ProcessReplyEx"]
    paths: ["src/internal.c", "src/tls13.c"]
  alerts:
    keywords: ["SendAlert", "record_overflow", "decode_error"]
    paths: ["src/internal.c"]

# Cờ build là đầu vào cố định, dùng chung cho Test driver và Code gate (tài liệu khả thi, mục 6).
build_flags: ["--enable-tls13", "--disable-shared", "--enable-static", "-DECC_MIN_KEY_SZ=224", "-DECC_SHAMIR", "-DECC_TIMING_RESISTANT", "-DERROR_QUEUE_PER_THREAD", "-DGCM_TABLE_4BIT", "-DHAVE_AESGCM", "-DHAVE_CHACHA", "-DHAVE_C___ATOMIC", "-DHAVE_DH", "-DHAVE_DH_DEFAULT_PARAMS", "-DHAVE_ECC", "-DHAVE_ENCRYPT_THEN_MAC", "-DHAVE_EXTENDED_MASTER", "-DHAVE_FFDHE_2048", "-DHAVE_GETPID", "-DHAVE_HASHDRBG", "-DHAVE_HKDF", "-DHAVE_LIMITS_H", "-DHAVE_POLY1305", "-DHAVE_SERVER_RENEGOTIATION_INFO", "-DHAVE_SNI", "-DHAVE_SUPPORTED_CURVES", "-DHAVE_SYS_TIME_H", "-DHAVE_SYS_UN_H", "-DHAVE_THREAD_LS", "-DHAVE_TLS_EXTENSIONS", "-DHAVE_WC_INTROSPECTION", "-DHAVE___UINT128_T", "-DNO_DES3", "-DNO_DES3_TLS_SUITES", "-DNO_DO178", "-DNO_DSA", "-DNO_MD4", "-DNO_MD5", "-DNO_OLD_TLS", "-DNO_PSK", "-DNO_RC4", "-DNO_SESSION_CACHE_REF", "-DTFM_TIMING_RESISTANT", "-DWC_NO_ASYNC_THREADING", "-DWC_RNG_AUTOFORK", "-DWC_RSA_BLINDING", "-DWC_RSA_PSS", "-DWOLFSSL_ARMASM_NO_HW_CRYPTO", "-DWOLFSSL_ASN_PRINT", "-DWOLFSSL_ASN_TEMPLATE", "-DWOLFSSL_BASE64_ENCODE", "-DWOLFSSL_DRBG_SHA512", "-DWOLFSSL_HAVE_ASSERT_H", "-DWOLFSSL_HAVE_ATOMIC_H", "-DWOLFSSL_HAVE_MLKEM", "-DWOLFSSL_PQC_HYBRIDS", "-DWOLFSSL_PSS_LONG_SALT", "-DWOLFSSL_SHA224", "-DWOLFSSL_SHA3", "-DWOLFSSL_SHA384", "-DWOLFSSL_SHA512", "-DWOLFSSL_SHAKE128", "-DWOLFSSL_SHAKE256", "-DWOLFSSL_SP_MATH_ALL", "-DWOLFSSL_SP_X86_64", "-DWOLFSSL_SYS_CA_CERTS", "-DWOLFSSL_TEST_STATIC_BUILD", "-DWOLFSSL_TLS13", "-DWOLFSSL_TLS13_MIDDLEBOX_COMPAT", "-DWOLFSSL_TLS_NO_MLKEM_STANDALONE", "-DWOLFSSL_USE_ALIGN", "-DWOLFSSL_X86_64_BUILD"]
build_config_complete: true

sut:
  repo: https://github.com/wolfSSL/wolfssl
  commit: 7685a578c739da6f2a4aadad97dc6fda117bf8fd
  recipe: sut/wolfssl.yaml
  start: {role: server, port: 4433}

references: ["openssl", "gnutls"]

code_scope:
  include: ["src/**", "wolfssl/**"]
  exclude: ["tests/**", "**/*.pem", "**/*.key", "certs/**"]

examples: examples/*.yaml

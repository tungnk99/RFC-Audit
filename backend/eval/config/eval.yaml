# Cấu hình dữ liệu và môi trường đánh giá (tài liệu "Thiết kế đánh giá", N1, N3, N5).
# Tệp này nằm trong eval_manifest: sửa nó sau khi chốt (bước 2) là thay đổi phải báo cáo.
version: 1

# Mốc kiến thức của mô hình (Bảng 6). Commit có ngày >= mốc vào tập đánh giá; trước mốc vào tập phát triển.
knowledge_cutoff: "2026-07-01"
window: {since: "2025-01-01", until: "2026-10-31"}

seeds: {sampling: 20260701, kappa: 20260702}

# Phiên bản cố định của bộ công cụ ngoài (lấy từ mã nguồn, không dùng PyPI: tài liệu khả thi, mục 6).
tools:
  tlsfuzzer: {repo: "https://github.com/tlsfuzzer/tlsfuzzer", commit: "5eebc4464e5197a7f7392fb9acda99cfc32441f7"}
  tlslite-ng: {repo: "https://github.com/tlsfuzzer/tlslite-ng", commit: "7e95ea1a86c0d42d8d931ff14134d31f01ce1d76"}

# SUT chính. `known` là lỗi thật đã chạy tay ở tài liệu khả thi (14/10/2026), dùng để kiểm tra môi trường.
sut:
  wolfssl:
    repo: "https://github.com/wolfSSL/wolfssl"
    known:
      bug:  {rev: "c18833f52^", note: "commit cha của bản sửa record_overflow"}
      fix:  {rev: "c18833f52"}
      head: {rev: "28bc7540d"}
    build_flags: ["--enable-tls13", "--disable-shared", "--enable-static"]
    cflags: ["-DWOLFSSL_TLS13_MIDDLEBOX_COMPAT"]

# Từ khoá lọc commit ứng viên (tài liệu khả thi, mục 3). Khớp không phân biệt hoa thường trên subject + body.
commit_keywords:
  - "RFC 8446"
  - "RFC 9846"
  - "RFC8446"
  - "record_overflow"
  - "illegal_parameter"
  - "unexpected_message"
  - "decode_error"
  - "missing_extension"
  - "unsupported_extension"
  - "protocol_version"
  - "handshake_failure"
  - "bad_record_mac"
  - "decrypt_error"
# Đã thử thêm "TLS 1.3", "TLS13" (221 và 267 commit), "close_notify", "fatal alert": quá rộng, loại.

# Cấu hình đối chứng (Bảng 7).
configs:
  required: [C0, B1, B2, B5]
  optional: [B3, B4]
runs: {C0_tls: 3, default: 1}

# Ngưỡng mục tiêu (Bảng 8): đề xuất, cần thầy chốt.
thresholds:
  false_compliant_max: 0.05
  precision_violation_min: 0.80
  recall_violation_min: 0.60
  decisive_rate_min: 0.60
  localization_min: 0.70

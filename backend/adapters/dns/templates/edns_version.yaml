# Mẫu bọc ca có sẵn của ISC genreport (tài liệu adapter, mục 5.2). Tên ca theo genreport; kiểm lại theo phiên bản cố định.
id: dns.edns.unknown_version
requirement_types: [B]
rfc_refs: ["RFC6891§6.1.3"]
checks_behavior: "receive(query, opt.version > {limit}) → respond(badvers)"
variant_class: length_bound
runner: genreport
runner_version: {genreport: "git:<sha>"}
cases:
  - variant: at_limit
    limit: 0
    case: "edns"          # truy vấn EDNS(0) hợp lệ: phải NOERROR
    expect: accepted
  - variant: just_above_limit
    limit: 0
    case: "edns1"         # EDNS version 1: phải BADVERS, không kèm câu trả lời
oracle: {pass: "alert == badvers", fail: "otherwise", error: "no_response or sanity_failed"}

# Adapter DNS (tài liệu adapter, Bảng 10): EDNS(0) và xử lý thông điệp của máy chủ có thẩm quyền.
# Dữ liệu khai báo, không mã tuỳ ý. Phải qua `rfcv adapter check adapters/dns` trước khi dùng.
# RFC 1034/1035/2181 viết "must" thường (trước BCP 14), RFC gate chỉ lấy từ khoá viết hoa nên chúng ở vai trò tham chiếu.
adapter: dns
version: 0.1.0
backend: dnspython

domain: rfc_protocol
verdict_profile: rfc-protocol@3
specs:
  - {doc: RFC6891, role: primary, sections_in_scope: ["6.1", "6.2", "7"]}
  - {doc: RFC1035, role: reference, sections_in_scope: ["4.1"]}
  - {doc: RFC1034, role: reference}
  - {doc: RFC2181, role: reference}

component_taxonomy: [message_parsing, edns, query_processing, response_building, transport]

vocabulary:
  events:
    - receive(query)
    - respond(rcode)
    - close
    - discard
  states: [ready]           # DNS không có bắt tay: máy chủ nhận truy vấn ngay
  enums:
    # RCODE đầy đủ (4 bit tiêu đề + 8 bit mở rộng trong OPT RR; badvers = 16 chỉ biểu diễn được khi có OPT)
    rcode: [noerror, formerr, servfail, nxdomain, notimp, refused, badvers]

field_domains:
  query.opt_count: {min: 0, max: 5000, canonical: [2]}   # số OPT RR trong phần additional; 5000 vừa một thông điệp TCP
  opt.version: {min: 0, max: 255, canonical: [1]}        # trường VERSION (8 bit) trong TTL của OPT RR

consistency_rules: []

# Gợi ý cho Locator. Tên tệp, hàm, hằng của Knot DNS; kiểm lại khi chốt commit SUT.
locator_hints:
  message_parsing:
    keywords: ["knot_pkt_parse", "opt_rr", "KNOT_EMALF", "KNOT_RCODE_FORMERR"]
    entry_points: ["knot_pkt_parse"]
    paths: ["src/libknot/packet/pkt.c"]
  edns:
    keywords: ["knot_edns_get_version", "KNOT_EDNS_VERSION", "KNOT_RCODE_BADVERS", "opt_rr"]
    paths: ["src/libknot/rrtype/opt.c", "src/knot/nameserver/process_query.c"]

build_flags: ["--disable-documentation", "--disable-fastparser"]

sut:
  repo: https://github.com/CZ-NIC/knot
  recipe: sut/knot.yaml
  start: {role: server, port: 5353}

references: ["coredns@<commit>", "bind9@<commit>"]

code_scope:
  include: ["src/**"]
  exclude: ["tests/**", "tests-fuzz/**", "doc/**", "samples/**"]

examples: examples/*.yaml

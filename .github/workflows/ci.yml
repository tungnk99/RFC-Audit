name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Pyright (strict)
        run: uv run pyright
      - name: Ranh giới kiến trúc (import-linter)
        run: uv run lint-imports
      - name: Kiểm thử (bất biến, hợp đồng I1–I9, Verdict engine, Oracle compiler)
        run: uv run pytest -q
      - name: Kiểm định adapter mẫu (phần hình thức)
        run: uv run rfcv adapter check adapters/tls13

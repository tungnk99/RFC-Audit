  <g stroke="#e2e8f0"><line x1="290" y1="48" x2="290" y2="296"/><line x1="432.5" y1="48" x2="432.5" y2="296"/><line x1="575" y1="48" x2="575" y2="296"/><line x1="717.5" y1="48" x2="717.5" y2="296"/><line x1="860" y1="48" x2="860" y2="296"/></g>
  <g fill="#64748b" font-size="12" text-anchor="middle"><text x="290" y="314">0</text><text x="432.5" y="314">175k</text><text x="575" y="314">350k</text><text x="717.5" y="314">525k</text><text x="860" y="314">700k</text></g>

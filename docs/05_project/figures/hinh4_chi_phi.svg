  <text x="20" y="520" font-size="13" fill="#475569">Biểu đồ a) tính trên bộ 50 mẫu (tổng 14,9 triệu token). Biểu đồ b) tính trên mọi lần chạy thật đã lưu, gồm cả các lần trong quá trình phát triển.</text>

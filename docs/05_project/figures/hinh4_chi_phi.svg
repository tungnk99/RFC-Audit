  <text x="20" y="372" font-size="15" font-weight="600" fill="#0f172a">b) Phân bổ token theo agent (129 lần chạy thật, tổng 36,7 triệu token)</text>
  <rect x="20" y="392" width="710" height="40" fill="#6d28d9"/>
  <rect x="730" y="392" width="117" height="40" fill="#a78bfa"/>
  <rect x="847" y="392" width="79" height="40" fill="#c4b5fd"/>
  <rect x="926" y="392" width="39" height="40" fill="#ddd6fe"/>
  <rect x="965" y="392" width="15" height="40" fill="#ede9fe" stroke="#6d28d9" stroke-width="0.8"/>
  <text x="390" y="418" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">Code Reader Agent 74%</text>
  <g font-size="14" fill="#1e293b">

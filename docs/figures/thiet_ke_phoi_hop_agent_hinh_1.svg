<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" font-family="Be Vietnam Pro, system-ui, sans-serif" width="960" height="470">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <g font-size="11.5" text-anchor="middle">
    <!-- Planner -->
    <rect x="370" y="15" width="220" height="62" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="480" y="40" font-weight="700">Planner</text><text x="480" y="59" font-size="10.5">① đọc trạng thái → PlanAction</text>
    <!-- Execution loop -->
    <rect x="300" y="120" width="360" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="480" y="143" font-weight="700">Execution loop (hub)</text><text x="480" y="161" font-size="10.5">② gán phong bì, ngân sách, phát hiện lặp, ghi Trace log</text>
    <!-- workers -->
    <rect x="20" y="225" width="190" height="66" rx="6" fill="#fff3e0" stroke="#e65100"/>
    <text x="115" y="250" font-weight="700">Code Reader</text><text x="115" y="268" font-size="10.5">tự tìm, đọc, đối chiếu mã</text><text x="115" y="283" font-size="10.5">(vùng cách ly)</text>
    <rect x="235" y="225" width="160" height="66" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="315" y="250" font-weight="700">Test</text><text x="315" y="268" font-size="10.5">chọn mẫu, biến thể</text>
    <rect x="420" y="225" width="160" height="66" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="500" y="250" font-weight="700">Locator</text><text x="500" y="268" font-size="10.5">truy vấn tĩnh của adapter</text>
    <rect x="605" y="225" width="160" height="66" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="685" y="250" font-weight="700">Verifier</text><text x="685" y="268" font-size="10.5">đối chiếu chéo</text><text x="685" y="283" font-size="10.5">bằng chứng</text>
    <!-- gates -->
    <rect x="20" y="335" width="190" height="50" rx="6" fill="#f5f5f5" stroke="#212121" stroke-width="2.5"/>
    <text x="115" y="357" font-weight="700">Schema gate</text><text x="115" y="374" font-size="10.5">đối chiếu chỉ mục → T1</text>
    <rect x="235" y="335" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#212121" stroke-width="2.5"/>
    <text x="315" y="357" font-weight="700">Tool gateway</text><text x="315" y="374" font-size="10.5">→ Test driver → T3</text>
    <rect x="420" y="335" width="160" height="50" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="500" y="357" font-weight="700">T2</text><text x="500" y="374" font-size="10.5">kết quả truy vấn</text>
    <!-- evidence & verdict -->
    <rect x="120" y="415" width="360" height="44" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="300" y="442" font-weight="700">Evidence store</text>
    <rect x="610" y="335" width="330" height="124" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="775" y="360" font-weight="700">Verdict engine</text>
    <text x="775" y="382" font-size="10.5">④ áp R0–R7 trên bằng chứng hiện có</text>
    <text x="775" y="400" font-size="10.5">→ nhãn tạm, hoặc</text>
    <text x="775" y="418" font-size="10.5">→ danh sách bằng chứng còn thiếu</text>
    <text x="775" y="436" font-size="10.5">→ có mâu thuẫn hay không</text>
  </g>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M480 77 V118" marker-end="url(#a)"/>
    <path d="M330 176 L130 223" marker-end="url(#a)"/>
    <path d="M420 176 L330 223" marker-end="url(#a)"/>
    <path d="M520 176 L505 223" marker-end="url(#a)"/>
    <path d="M620 176 L680 223" marker-end="url(#a)"/>
    <path d="M115 291 V333" marker-end="url(#a)"/>
    <path d="M315 291 V333" marker-end="url(#a)"/>
    <path d="M500 291 V333" marker-end="url(#a)"/>
    <path d="M115 385 V437 H118" marker-end="url(#a)"/>
    <path d="M315 385 V413" marker-end="url(#a)"/>
    <path d="M500 385 V437 H482" marker-end="url(#a)"/>
    <path d="M480 437 H608" marker-end="url(#a)"/>
    <path d="M940 395 H950 V46 H592" marker-end="url(#a)"/>
    <path d="M765 255 H860 V60 H592" stroke-dasharray="5 3" marker-end="url(#a)"/>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="880" y="210">⑤ trạng thái</text><text x="880" y="225">vòng mới</text>
    <text x="772" y="245">Critique</text>
  </g>
</svg>

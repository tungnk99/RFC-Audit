<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" font-family="Be Vietnam Pro, system-ui, sans-serif" width="960" height="440">
  <defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect x="10" y="10" width="780" height="420" rx="10" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="24" y="32" font-size="13" font-weight="700">MÁY CHỦ THỰC NGHIỆM (Linux, Docker Engine)</text>
  <rect x="30" y="45" width="360" height="200" rx="8" fill="#eef4fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="42" y="64" font-size="11.5" font-weight="700" fill="#0d47a1">CONTROL ZONE</text>
  <rect x="45" y="75" width="330" height="95" rx="5" fill="#fff" stroke="#555"/>
  <text x="210" y="96" font-size="12" font-weight="700" text-anchor="middle">rfcv-harness</text>
  <text x="210" y="116" font-size="11" text-anchor="middle">Execution loop, các cổng, Oracle compiler,</text>
  <text x="210" y="133" font-size="11" text-anchor="middle">Verdict engine, Evidence store, LLM gateway</text>
  <text x="210" y="152" font-size="11" text-anchor="middle">CLI cho Auditor và Reviewer</text>
  <rect x="45" y="182" width="330" height="48" rx="5" fill="#fff" stroke="#555"/>
  <text x="210" y="202" font-size="12" font-weight="700" text-anchor="middle">egress-proxy</text>
  <text x="210" y="220" font-size="11" text-anchor="middle">chỉ cho phép tới endpoint LLM</text>
  <rect x="410" y="45" width="360" height="120" rx="8" fill="#fdf6ec" stroke="#b26a00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="422" y="64" font-size="11.5" font-weight="700" fill="#8a5300">ANALYSIS ZONE (không có mạng)</text>
  <rect x="425" y="75" width="330" height="75" rx="5" fill="#fff" stroke="#555"/>
  <text x="590" y="96" font-size="12" font-weight="700" text-anchor="middle">code-index-worker</text>
  <text x="590" y="116" font-size="11" text-anchor="middle">tree-sitter, CodeQL, quét nhánh nghi vấn</text>
  <text x="590" y="134" font-size="11" text-anchor="middle">kho mã gắn chỉ đọc</text>
  <rect x="410" y="180" width="360" height="150" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="422" y="199" font-size="11.5" font-weight="700" fill="#b71c1c">TEST ZONE (mạng nội bộ cô lập)</text>
  <rect x="422" y="210" width="110" height="70" rx="5" fill="#fff" stroke="#555"/>
  <text x="477" y="238" font-size="12" font-weight="700" text-anchor="middle">test-driver</text>
  <text x="477" y="256" font-size="10.5" text-anchor="middle">backend DSL</text>
  <rect x="542" y="210" width="105" height="70" rx="5" fill="#fff" stroke="#555"/>
  <text x="594" y="236" font-size="12" font-weight="700" text-anchor="middle">SUT</text>
  <text x="594" y="252" font-size="10.5" text-anchor="middle">bản thường</text><text x="594" y="267" font-size="10.5" text-anchor="middle">và bản đo phủ</text>
  <rect x="657" y="210" width="105" height="70" rx="5" fill="#fff" stroke="#555"/>
  <text x="709" y="236" font-size="12" font-weight="700" text-anchor="middle">Tham chiếu</text>
  <text x="709" y="252" font-size="10.5" text-anchor="middle">≥ 2 bản triển khai</text><text x="709" y="267" font-size="10.5" text-anchor="middle">khác, đột biến</text>
  <line x1="532" y1="245" x2="542" y2="245" stroke="#333" stroke-width="1.5"/>
  <path d="M477 280 V292 H709 V280" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="318" font-size="11" text-anchor="middle" fill="#b71c1c">tạo mới cho mỗi lần chạy kịch bản, huỷ ngay sau đó</text>
  <rect x="30" y="260" width="360" height="155" rx="8" fill="#f5f5f5" stroke="#757575"/>
  <text x="42" y="279" font-size="11.5" font-weight="700" fill="#424242">VOLUMES</text>
  <g font-size="11">
    <text x="45" y="302">inputs/  RFC, adapter, policy (chỉ đọc)</text>
    <text x="45" y="322">repos/   kho mã và bản tham chiếu tại commit (chỉ đọc)</text>
    <text x="45" y="342">runs/&lt;run_id&gt;/  evidence.db, registry.db, trace.db</text>
    <text x="45" y="362">runs/&lt;run_id&gt;/artifacts/  theo hash</text>
    <text x="45" y="382">runs/&lt;run_id&gt;/report/  HTML, JSON, SARIF, bản kê</text>
    <text x="45" y="402">index/   chỉ mục mã, CodeQL DB (dựng lại được)</text>
  </g>
  <rect x="810" y="60" width="140" height="56" rx="6" fill="#fff" stroke="#555" stroke-dasharray="3 3"/>
  <text x="880" y="84" font-size="12" font-weight="700" text-anchor="middle">Dịch vụ LLM</text><text x="880" y="102" font-size="11" text-anchor="middle">(API)</text>
  <rect x="810" y="350" width="140" height="56" rx="6" fill="#fff" stroke="#555" stroke-dasharray="3 3"/>
  <text x="880" y="374" font-size="12" font-weight="700" text-anchor="middle">Kho Git công khai</text><text x="880" y="392" font-size="11" text-anchor="middle">(GitHub, GitLab)</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M375 206 H395 V25 H880 V58" marker-end="url(#d1)"/>
    <path d="M375 112 H423" marker-end="url(#d1)" stroke-dasharray="5 3"/>
    <path d="M375 150 H400 V245 H420" marker-end="url(#d1)" stroke-dasharray="5 3"/>
    <path d="M808 378 H795 V425 H200 V417" marker-end="url(#d1)" stroke-dasharray="2 3"/>
  </g>
  <g font-size="10.5" fill="#333">
    <text x="600" y="20">HTTPS tới endpoint LLM duy nhất</text>
    <text x="379" y="104" font-size="10">lệnh</text>
    <text x="560" y="420">checkout commit cố định, trước khi chạy</text>
  </g>
</svg>

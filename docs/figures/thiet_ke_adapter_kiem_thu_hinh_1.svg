    <rect x="525" y="60" width="180" height="100" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="615" y="84" font-weight="700">Test driver</text>
    <text x="615" y="104" font-size="10.5">runner: tlsfuzzer, h2spec,</text>
    <text x="615" y="120" font-size="10.5">genreport, DSL…</text>
    <text x="615" y="140" font-size="10.5">→ quan sát chuẩn hoá</text>
    <rect x="745" y="60" width="170" height="100" rx="6" fill="#fff3e0" stroke="#e65100"/>
    <text x="830" y="84" font-weight="700">SUT</text>
    <text x="830" y="104" font-size="10.5">image theo digest</text>
    <text x="830" y="120" font-size="10.5">mỗi ca một tiến trình</text>
    <text x="830" y="140" font-size="10.5">(UNTRUSTED)</text>
    <rect x="525" y="200" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="615" y="223" font-weight="700">Oracle</text><text x="615" y="241" font-size="10.5">PASS / FAIL / ERROR</text>
    <rect x="745" y="200" width="170" height="56" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="830" y="223" font-weight="700">Artifact store</text><text x="830" y="241" font-size="10.5">pcap, nhật ký (theo hash)</text>
    <rect x="505" y="335" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="605" y="357" font-weight="700">Evidence store</text><text x="605" y="374" font-size="10.5">bản ghi T3</text>
    <rect x="745" y="335" width="190" height="50" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="840" y="357" font-weight="700">Verdict engine</text><text x="840" y="374" font-size="10.5">R0–R7</text>

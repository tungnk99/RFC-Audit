<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" font-family="Be Vietnam Pro, system-ui, sans-serif" width="960" height="400">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="20" width="200" height="120" rx="6" fill="#f5f5f5" stroke="#757575"/>
    <text x="120" y="42" font-weight="700">Protocol adapter</text>
    <text x="120" y="62" font-size="10.5">sut: công thức dựng SUT</text>
    <text x="120" y="78" font-size="10.5">templates: mẫu kiểm thử</text>
    <text x="120" y="94" font-size="10.5">variants: biến thể bắt buộc</text>
    <text x="120" y="110" font-size="10.5">observations, oracle</text>
    <text x="120" y="126" font-size="10.5">runner: bộ chuyển đổi công cụ</text>
    <rect x="20" y="175" width="200" height="56" rx="6" fill="#f5f5f5" stroke="#212121" stroke-width="2.5"/>
    <text x="120" y="198" font-weight="700">Adapter checker</text><text x="120" y="216" font-size="10.5">kiểm định trước khi nạp</text>
    <rect x="270" y="20" width="190" height="62" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="365" y="45" font-weight="700">Test Agent</text><text x="365" y="64" font-size="10.5">TestSelection: mẫu + biến thể</text>
    <rect x="270" y="120" width="190" height="62" rx="6" fill="#f5f5f5" stroke="#212121" stroke-width="2.5"/>
    <text x="365" y="145" font-weight="700">Tool gateway</text><text x="365" y="164" font-size="10.5">ghép mẫu–yêu cầu, tính tham số</text>
    <rect x="505" y="20" width="430" height="290" rx="8" fill="none" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6 3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="820" height="340" fill="#ffffff" rx="6"/>
  <text x="410" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">So sánh Đối đầu trên 27 ca thật (8 OpenSSL advanced + 19 held_out)</text>
  <text x="410" y="42" text-anchor="middle" font-size="10.5" fill="#4b5563">Chứng minh System &gt; Model: RFC-Audit (DeepSeek-V4-Flash) áp đảo cả B2-Pro (deepseek-v4-pro Reasoning)</text>

  <!-- Legend -->
  <g font-size="9.5" fill="#111827">
    <rect x="82" y="53" width="12" height="10" fill="#9ca3af"/><text x="98" y="62">B1 Test-only (hộp đen)</text>
    <rect x="232" y="53" width="12" height="10" fill="#f59e0b"/><text x="248" y="62">B2-Flash (V4-Flash)</text>
    <rect x="372" y="53" width="12" height="10" fill="#7c3aed"/><text x="388" y="62">B2-Pro (deepseek-v4-pro Reasoning)</text>
    <rect x="588" y="53" width="12" height="10" fill="#059669"/><text x="604" y="62" font-weight="bold">C0 RFC-Audit (V4-Flash)</text>
  </g>

  <!-- Grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="65" y1="80" x2="780" y2="80"/>
    <line x1="65" y1="120" x2="780" y2="120"/>
    <line x1="65" y1="160" x2="780" y2="160"/>
    <line x1="65" y1="200" x2="780" y2="200"/>
    <line x1="65" y1="240" x2="780" y2="240"/>
    <line x1="65" y1="280" x2="780" y2="280"/>
  </g>
  <g font-size="9.5" fill="#374151" text-anchor="end">
    <text x="58" y="84">100%</text>
    <text x="58" y="124">80%</text>
    <text x="58" y="164">60%</text>
    <text x="58" y="204">40%</text>
    <text x="58" y="244">20%</text>
    <text x="58" y="284">0%</text>
  </g>
  <line x1="65" y1="80" x2="65" y2="280" stroke="#374151" stroke-width="1.2"/>
  <line x1="65" y1="280" x2="780" y2="280" stroke="#374151" stroke-width="1.2"/>

  <!-- Group 1: Verdict Accuracy (100, 55.6, 74.1, 100) -->
  <g>
    <rect x="92" y="80" width="28" height="200" fill="#9ca3af"/><text x="106" y="75" text-anchor="middle" font-size="8.5">100%</text>
    <rect x="123" y="169" width="28" height="111" fill="#f59e0b"/><text x="137" y="164" text-anchor="middle" font-size="8.5">55,6%</text>
    <rect x="154" y="132" width="28" height="148" fill="#7c3aed"/><text x="168" y="127" text-anchor="middle" font-size="8.5">74,1%</text>
    <rect x="185" y="80" width="28" height="200" fill="#059669"/><text x="199" y="75" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#059669">100%</text>
    <text x="152" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Verdict Accuracy</text>
    <text x="152" y="311" text-anchor="middle" font-size="8.5" fill="#6b7280">(Cao hơn = Tốt · 27 ca)</text>
  </g>

  <!-- Group 2: Defect Hit STRICT 12 VIOLATION (0, 16.7, 41.7, 91.7) -->
  <g>
    <rect x="272" y="278" width="28" height="2" fill="#9ca3af"/><text x="286" y="273" text-anchor="middle" font-size="8.5">0%</text>
    <rect x="303" y="247" width="28" height="33" fill="#f59e0b"/><text x="317" y="242" text-anchor="middle" font-size="8.5">16,7%</text>
    <rect x="334" y="197" width="28" height="83" fill="#7c3aed"/><text x="348" y="192" text-anchor="middle" font-size="8.5">41,7%</text>
    <rect x="365" y="97" width="28" height="183" fill="#059669"/><text x="379" y="92" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#059669">91,7%</text>
    <text x="332" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Định vị STRICT</text>
    <text x="332" y="311" text-anchor="middle" font-size="8.5" fill="#6b7280">(Cao hơn = Tốt · 12 lỗi)</text>
  </g>

  <!-- Group 3: Held-out Defect Hit STRICT (0, 20, 20, 100) -->
  <g>
    <rect x="452" y="278" width="28" height="2" fill="#9ca3af"/><text x="466" y="273" text-anchor="middle" font-size="8.5">0%</text>
    <rect x="483" y="240" width="28" height="40" fill="#f59e0b"/><text x="497" y="235" text-anchor="middle" font-size="8.5">20,0%</text>
    <rect x="514" y="240" width="28" height="40" fill="#7c3aed"/><text x="528" y="235" text-anchor="middle" font-size="8.5">20,0%</text>
    <rect x="545" y="80" width="28" height="200" fill="#059669"/><text x="559" y="75" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#059669">100%</text>
    <text x="512" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Định vị held_out</text>
    <text x="512" y="311" text-anchor="middle" font-size="8.5" fill="#6b7280">(Cao hơn = Tốt · 5 lỗi)</text>
  </g>

  <!-- Group 4: False Compliant (0, 75.0, 33.3, 0) -->
  <g>
    <rect x="632" y="278" width="28" height="2" fill="#9ca3af"/><text x="646" y="273" text-anchor="middle" font-size="8.5">0%</text>
    <rect x="663" y="130" width="28" height="150" fill="#f59e0b"/><text x="677" y="125" text-anchor="middle" font-size="8.5">75,0%</text>
    <rect x="694" y="213" width="28" height="67" fill="#7c3aed"/><text x="708" y="208" text-anchor="middle" font-size="8.5">33,3%</text>
    <rect x="725" y="278" width="28" height="2" fill="#059669"/><text x="739" y="273" text-anchor="middle" font-size="8.8" font-weight="bold" fill="#059669">0%</text>
    <text x="692" y="298" text-anchor="middle" font-size="10" font-weight="bold" fill="#dc2626">Bỏ sót lỗi (F1)</text>
    <text x="692" y="311" text-anchor="middle" font-size="8.5" fill="#dc2626">(Thấp hơn = Tốt · 0% là tối ưu)</text>
  </g>

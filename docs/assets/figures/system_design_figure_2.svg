  </g>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="55" width="250" height="64" rx="6" fill="#ede7f6" stroke="#5e35b1"/><text x="145" y="80" font-weight="700">RFC Analyst × 2 luồng</text><text x="145" y="99">đặc tả hành vi (RBS)</text>
    <rect x="330" y="55" width="360" height="64" rx="6" fill="#f5f5f5" stroke="#757575"/><text x="510" y="80">so khớp hai bản, kiểm tra từ vựng adapter,</text><text x="510" y="99">Auditor duyệt bất đồng · Oracle compiler</text>
    <rect x="750" y="55" width="190" height="64" rx="6" fill="#ecf7ef" stroke="#14532d"/><text x="845" y="80" font-weight="700">Yêu cầu + oracle</text><text x="845" y="99">đã chuẩn hoá</text>
    <rect x="20" y="145" width="250" height="64" rx="6" fill="#ede7f6" stroke="#5e35b1"/><text x="145" y="170" font-weight="700">Test Agent</text><text x="145" y="189">kịch bản trong DSL</text>

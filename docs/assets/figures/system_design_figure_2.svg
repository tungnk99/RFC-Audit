    <rect x="20" y="235" width="250" height="64" rx="6" fill="#fdecea" stroke="#c62828" stroke-dasharray="5 3"/><text x="145" y="260" font-weight="700">Code Reader</text><text x="145" y="279">vị trí mã (LocationClaim)</text>
    <rect x="330" y="235" width="360" height="64" rx="6" fill="#f5f5f5" stroke="#757575"/><text x="510" y="260">đối chiếu chỉ mục tại commit; Coverage linker:</text><text x="510" y="279">kiểm thử có chạy qua vị trí này không</text>
